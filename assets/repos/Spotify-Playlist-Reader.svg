<svg width="480" height="180" viewBox="0 0 480 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Spotify-Playlist-Reader">
  <rect width="480" height="180" rx="8" fill="#1a1b27" stroke="#2f3352"/>
  <text x="20" y="32" font-size="16" font-weight="700" fill="#e1e4e8" xml:space="preserve">Spotify-Playlist-Reader</text>
  <text x="20" y="62" font-size="13.5" fill="#9da7d3" xml:space="preserve">Spotify Playlist Reader deals with analyzing the playlists</text>
  <text x="20" y="82" font-size="13.5" fill="#9da7d3" xml:space="preserve">(for the moment only the public ones) and showing the data</text>
