<svg width="480" height="180" viewBox="0 0 480 180" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="tdl">
  <rect width="480" height="180" fill="#1a1b27"/>
  <rect width="480" height="180" rx="8" fill="none" stroke="#2f3352"/>
  <text x="20" y="32" font-size="16" font-weight="700" fill="#e1e4e8" xml:space="preserve">tdl</text>
  <text x="20" y="62" font-size="13" fill="#9da7d3" xml:space="preserve">📥 A Telegram toolkit written in Golang. Migrate chats, export</text>
  <text x="20" y="82" font-size="13" fill="#9da7d3" xml:space="preserve">messages, and manage sessions from the CLI. Supports</text>
  <text x="20" y="102" font-size="13" fill="#9da7d3" xml:space="preserve">concurrent downloads and bulk operations.</text>
  <circle cx="20" cy="151" r="4" fill="#00ADD8"/>
  <text x="32" y="156" font-size="13" fill="#9da7d3" xml:space="preserve">Go · forked from iyear/tdl</text>
  <text x="428" y="156" font-size="13" fill="#9da7d3" text-anchor="end" xml:space="preserve">⭐ 0</text>
  <text x="460" y="156" font-size="13" fill="#9da7d3" text-anchor="end" xml:space="preserve">🍴 0</text>
</svg>
