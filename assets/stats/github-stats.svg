<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240" role="img" aria-labelledby="title description">
  <title id="title">GitHub statistics</title>
  <desc id="description">Public repositories: 21. Stars earned: 103. Repository forks: 11. Followers: 29. Rank: A (formula percentile: 19.2). Rank inputs: 1234 commits and 4 reviews in the past year, 160 pull requests and 83 issues in total. An activity indicator, not a code quality assessment.</desc>
  <style>
    .background { fill: #ffffff; stroke: #d1d9e0; }
    .heading { fill: #8250df; }
    .label { fill: #59636e; }
    .value { fill: #1f2328; }
    .track { fill: #eaeef2; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; stroke: #3d444d; }
      .heading { fill: #bc8cff; }
      .label { fill: #9198a1; }
      .value { fill: #f0f6fc; }
      .track { fill: #212830; }
    }
  </style>
  <rect class="background" x="0.5" y="0.5" width="459" height="239" rx="10" />
  <text class="heading" x="24" y="35" font-size="18" font-weight="600">GitHub statistics</text>
  <text class="label" x="24" y="75" font-size="14">Public repositories</text>
  <text class="value" x="265" y="75" text-anchor="end" font-size="16" font-weight="600">21</text>
  <text class="label" x="24" y="110" font-size="14">Stars earned</text>
  <text class="value" x="265" y="110" text-anchor="end" font-size="16" font-weight="600">103</text>
  <text class="label" x="24" y="145" font-size="14">Repository forks</text>
  <text class="value" x="265" y="145" text-anchor="end" font-size="16" font-weight="600">11</text>
  <text class="label" x="24" y="180" font-size="14">Followers</text>
  <text class="value" x="265" y="180" text-anchor="end" font-size="16" font-weight="600">29</text>
  <circle class="track" cx="370" cy="119" r="49" />
  <circle class="background" cx="370" cy="119" r="43" />
  <text class="heading" x="370" y="130" text-anchor="middle" font-size="32" font-weight="700">A</text>
  <text class="label" x="370" y="188" text-anchor="middle" font-size="12">GitHub rank</text>
  <text class="label" x="24" y="212" font-size="10">Rank: GitHub Readme Stats formula; commits/reviews: past year.</text>
  <text class="label" x="24" y="228" font-size="10">Stars and forks exclude forked repositories.</text>
</svg>
