<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240" role="img" aria-labelledby="title description">
  <title id="title">Most used languages</title>
  <desc id="description">Go: 50.9%. TypeScript: 29.3%. CSS: 7.2%. JavaScript: 5.1%. Java: 3.5%</desc>
  <style>
    .background { fill: #ffffff; stroke: #d1d9e0; }
    .heading { fill: #8250df; }
    .label { fill: #59636e; }
    .value { fill: #1f2328; }
    .track { fill: #eaeef2; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #0d1117; stroke: #3d444d; }
      .heading { fill: #bc8cff; }
      .label { fill: #9198a1; }
      .value { fill: #f0f6fc; }
      .track { fill: #212830; }
    }
  </style>
  <rect class="background" x="0.5" y="0.5" width="459" height="239" rx="10" />
  <text class="heading" x="24" y="35" font-size="18" font-weight="600">Most used languages</text>
  <text class="value" x="24" y="65" font-size="13">Go</text>
  <text class="label" x="432" y="65" text-anchor="end" font-size="12">50.9%</text>
  <rect class="track" x="24" y="71" width="408" height="5" rx="2.5" />
  <rect x="24" y="71" width="207.77" height="5" rx="2.5" fill="#8250df" />
  <text class="value" x="24" y="94" font-size="13">TypeScript</text>
  <text class="label" x="432" y="94" text-anchor="end" font-size="12">29.3%</text>
  <rect class="track" x="24" y="100" width="408" height="5" rx="2.5" />
  <rect x="24" y="100" width="119.66" height="5" rx="2.5" fill="#2f81f7" />
  <text class="value" x="24" y="123" font-size="13">CSS</text>
  <text class="label" x="432" y="123" text-anchor="end" font-size="12">7.2%</text>
  <rect class="track" x="24" y="129" width="408" height="5" rx="2.5" />
  <rect x="24" y="129" width="29.23" height="5" rx="2.5" fill="#3fb950" />
  <text class="value" x="24" y="152" font-size="13">JavaScript</text>
  <text class="label" x="432" y="152" text-anchor="end" font-size="12">5.1%</text>
  <rect class="track" x="24" y="158" width="408" height="5" rx="2.5" />
  <rect x="24" y="158" width="20.81" height="5" rx="2.5" fill="#d29922" />
  <text class="value" x="24" y="181" font-size="13">Java</text>
  <text class="label" x="432" y="181" text-anchor="end" font-size="12">3.5%</text>
  <rect class="track" x="24" y="187" width="408" height="5" rx="2.5" />
  <rect x="24" y="187" width="14.12" height="5" rx="2.5" fill="#db6d28" />
  <text class="label" x="24" y="228" font-size="11">By code size across public, non-fork repositories.</text>
</svg>
