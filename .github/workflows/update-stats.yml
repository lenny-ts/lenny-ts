name: Update profile statistics

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/readme-refresh
    paths:
      - .github/scripts/gen_stats.py
      - .github/scripts/licenses/github-readme-stats.txt
      - .github/workflows/update-stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate profile cards
        run: python3 .github/scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: ${{ github.repository_owner }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats/github-stats.svg assets/stats/top-languages.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore: update profile statistics [skip ci]"
            git push
          fi
