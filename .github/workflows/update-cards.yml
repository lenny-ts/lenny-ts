name: Update Pinned Repo Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install cairosvg Pillow

      - name: Generate repo cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/gen_cards.py

      - name: Bust camo cache in README
        run: |
          STAMP=$(date +%s)
          sed -i "s/\.png?v=[0-9]*/\.png?v=${STAMP}/g" README.md

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add assets/repos/*.png assets/repos/*.svg README.md
          git diff --staged --quiet || git commit -m "chore: update repo card stars/forks [skip ci]"
          git push
